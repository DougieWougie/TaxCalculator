services:
  pension-calculator:
    container_name: pension-calculator
    # The deploy pipeline exports IMAGE_TAG=sha-<commit> so each deploy pins the
    # exact image built for that commit. Without this key `docker compose pull`
    # is a no-op and the host silently keeps running a locally built image.
    image: ghcr.io/dougiewougie/taxcalculator:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    # No published ports: nginx-proxy-manager reaches the container by service
    # name over the shared proxy network. nginx listens on 8080 as non-root.
    expose:
      - "8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /tmp
      - /var/log/nginx:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - proxy

networks:
  proxy:
    external: true
