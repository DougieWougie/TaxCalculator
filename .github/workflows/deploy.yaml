name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:

# Queue runs per ref so deploys land in order; an in-progress deploy is never
# cancelled, and a superseded pending deploy is dropped in favour of the newest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run test

  build-and-push:
    # Only pushes to main build an image; PRs stop after the test job.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # format=long makes the sha tag the full 40-char commit hash, so the
          # deploy job can derive it from github.sha without truncation.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: github-actions
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/docker/tax

            # The GHCR package is private; authenticate the pull with this
            # run's ephemeral GITHUB_TOKEN instead of a long-lived PAT.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Deploy the exact image built for this commit, not whatever
            # "latest" happens to be. The compose file on this host reads
            # IMAGE_TAG (defaulting to latest).
            export IMAGE_TAG=sha-${{ github.sha }}

            # Remember the running image for rollback.
            PREV_ID=$(docker compose ps -q pension-calculator 2>/dev/null || true)
            PREV_IMAGE=""
            if [ -n "$PREV_ID" ]; then
              PREV_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$PREV_ID")
            fi

            docker compose pull
            # --remove-orphans clears containers left over from earlier
            # compose/service names (e.g. the pre-pipeline tax-app container,
            # which otherwise holds the container_name and blocks creation).
            docker compose up -d --remove-orphans

            # Wait for the container's HEALTHCHECK to pass (up to 60s).
            STATUS=starting
            for i in $(seq 1 12); do
              sleep 5
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' \
                "$(docker compose ps -q pension-calculator)")
              if [ "$STATUS" = "healthy" ]; then
                break
              fi
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "::error::New container is '$STATUS' after 60s — rolling back"
              if [ -n "$PREV_IMAGE" ]; then
                IMAGE_TAG="${PREV_IMAGE##*:}" docker compose up -d --remove-orphans
              fi
              exit 1
            fi

            # Old images keep their sha tags, so prune anything unused and
            # older than 7 days to bound disk usage while keeping a week of
            # rollback candidates.
            docker image prune -af --filter "until=168h"
